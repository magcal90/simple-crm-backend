version: 2.1
orbs:
  snyk: snyk/snyk@2.3.0
jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - run:
          name: Install dependencies and build
          command: |
            echo "Ingest the version from release.env..."
            source release.env
            echo "Building the application..."
            ./mvnw --batch-mode -Drevision="$RELEASE_VERSION" clean package -DskipTests
      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}
      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar

  test:
    docker:
      - image: cimg/openjdk:21.0
      - image: cimg/postgres:16.0
        environment:
          POSTGRES_DB: simplecrm
          POSTGRES_USER: simplecrm
          POSTGRES_PASSWORD: password
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/simplecrm
      SPRING_DATASOURCE_USERNAME: simplecrm
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      JWT_SECRET: circleci-test-secret-circleci-test-secret
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - run:
          name: Install PostgreSQL client
          command: |
            sudo apt-get update && sudo apt-get install -y postgresql-client
      - run:
          name: Wait for PostgreSQL
          command: |
            for i in {1..10}; do
              if pg_isready -h localhost -p 5432 -U postgres; then
                echo "PostgreSQL is ready!"
                exit 0
              fi
              echo "Waiting for PostgreSQL... ($i/10)"
              sleep 3
            done
            echo "PostgreSQL failed to start"
            exit 1
      - run:
          name: Run tests
          command: |
            source release.env
            echo "Running the tests..."
            ./mvnw --batch-mode -Drevision="$RELEASE_VERSION" test
      - store_test_results:
            path: target/surefire-reports
      - store_artifacts:
            path: target/surefire-reports
  # ==========================================
  # SNYK_SCAN JOB - Snyk: scan Maven dependencies
  # ==========================================
  snyk_scan:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - snyk/scan:
          fail-on-issues: false
          severity-threshold: high
          cli-version: 1.1308.1
          monitor-on-build: false

  # ==========================================
  # SNYK_CODE JOB - Snyk Code: static analysis (SAST) of src/
  # ==========================================
  snyk_code:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - snyk/scan:
          fail-on-issues: false
          command: code test
          severity-threshold: high
          cli-version: 1.1308.1
          monitor-on-build: false

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build image
          command: |
            source release.env
            echo "Building the image..."
            docker build --build-arg APP_VERSION="$RELEASE_VERSION" --build-arg VCS_REF="$CIRCLE_SHA1" -t "$DOCKER_USERNAME/simple-crm-backend:$RELEASE_VERSION" -t "$DOCKER_USERNAME/simple-crm-backend:latest" .
      - run:
          name: Push images to Docker Hub
          command: |
            source release.env
            echo "Pushing the image to Docker Hub..."
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker push "$DOCKER_USERNAME/simple-crm-backend:$RELEASE_VERSION"
            docker push "$DOCKER_USERNAME/simple-crm-backend:latest"
  
  # ========================================== 
  # DEPLOY JOB - Trigger Render Redeploy 
  # ========================================== 
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Trigger Render Deploy Hook
          command: |
            echo "Triggering Render to pull latest image..."
            curl -X POST "$RENDER_DEPLOY_HOOK"

  # ==========================================
  # NOTIFY JOB - Post the deployment result to Discord
  # ==========================================
  notify:
    parameters:
      result:
        type: enum
        enum: ["success", "failed"]
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Send the deployment result to Discord
          command: |
            if [ "<< parameters.result >>" = "success" ]; then
              MESSAGE="✅ devops-demo deployed to production - commit ${CIRCLE_SHA1:0:7} by ${CIRCLE_USERNAME}"
            else
              MESSAGE="❌ devops-demo deployment FAILED - commit ${CIRCLE_SHA1:0:7} by ${CIRCLE_USERNAME}. Production is still running the previous version."
            fi
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"${MESSAGE}\"}" \
              "$DISCORD_WEBHOOK_URL"
            echo "Posted to Discord: ${MESSAGE}"  

workflows:
  build-test-scan_publish-deploy:
    jobs:
      - build
      - snyk_scan
      - snyk_code
      - test:
          requires:
            - build
      - publish:
          context: docker-hub
          requires:
            - test
            - snyk_scan
            - snyk_code
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - publish
          filters:
            branches:
              only: main
      - notify:
          name: notify-success
          result: success
          requires:
            - deploy: success
      - notify:
          name: notify-failure
          result: failed
          requires:
            - deploy: failed
