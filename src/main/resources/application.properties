spring.application.name=simple-crm

# Spring Security default user configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Server configuration
server.port=${PORT:8080}

# CORS configuration for allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional first user. The plaintext value is read only at startup and the
# database stores its BCrypt hash. Once created, these variables may be removed.
app.bootstrap-user.email=${APP_BOOTSTRAP_USER_EMAIL:}
app.bootstrap-user.password=${APP_BOOTSTRAP_USER_PASSWORD:}

# Database configuration (from Docker Compose environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA configuration - retained for this assignment; use migrations before a
# production-hardening release.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s







